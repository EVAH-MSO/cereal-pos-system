<div class="settings-container">
  <div class="page-header">
    <h1>⚙️ Settings</h1>
    <p>Configure your shop preferences</p>
  </div>

  <div class="settings-grid">
    <!-- Shop Information -->
    <div class="settings-card">
      <h3>🏪 Shop Information</h3>
      <div class="form-group">
        <label>Shop Name</label>
        <input type="text" [(ngModel)]="shopSettings.name" class="form-control">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="shopSettings.email" class="form-control">
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="text" [(ngModel)]="shopSettings.phone" class="form-control">
      </div>
      <div class="form-group">
        <label>Address</label>
        <textarea [(ngModel)]="shopSettings.address" class="form-control" rows="2"></textarea>
      </div>
    </div>

    <!-- Receipt Settings -->
    <div class="settings-card">
      <h3>🧾 Receipt Settings</h3>
      <div class="form-group">
        <label>Receipt Footer Message</label>
        <textarea [(ngModel)]="shopSettings.receiptFooter" class="form-control" rows="2"></textarea>
      </div>
      <div class="form-group">
        <label>Tax Rate (%)</label>
        <input type="number" [(ngModel)]="shopSettings.taxRate" class="form-control" step="0.5">
      </div>
      <div class="form-group">
        <label>Currency</label>
        <select [(ngModel)]="shopSettings.currency" class="form-control">
          <option value="KES">Kenyan Shilling (KES)</option>
          <option value="USD">US Dollar (USD)</option>
          <option value="EUR">Euro (EUR)</option>
        </select>
      </div>
    </div>

    <!-- Security -->
    <div class="settings-card">
      <h3>🔐 Security</h3>
      <div class="form-group">
        <label>Current Email</label>
        <input type="email" [(ngModel)]="userEmail" class="form-control" disabled>
      </div>
      <div class="form-group">
        <label>New Password</label>
        <input type="password" [(ngModel)]="newPassword" class="form-control" placeholder="••••••">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" [(ngModel)]="confirmPassword" class="form-control" placeholder="••••••">
      </div>
      <button class="btn-secondary" (click)="changePassword()">Change Password</button>
      <div class="message" *ngIf="passwordMessage">{{ passwordMessage }}</div>
    </div>

    <!-- Data Management -->
    <div class="settings-card">
      <h3>💾 Data Management</h3>
      <div class="form-group">
        <label>Low Stock Threshold</label>
        <input type="number" [(ngModel)]="lowStockThreshold" class="form-control">
        <small>Products below this quantity will trigger alerts</small>
      </div>
      <div class="form-group">
        <label>Auto Backup</label>
        <select [(ngModel)]="backupFrequency" class="form-control">
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
          <option value="never">Never</option>
        </select>
      </div>
      <button class="btn-secondary" (click)="exportData()">📥 Export All Data</button>
    </div>
  </div>

  <!-- Save Button -->
  <div class="save-section">
    <button class="btn-save" (click)="saveSettings()">💾 Save All Settings</button>
  </div>
</div>
