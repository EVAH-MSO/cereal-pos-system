<div class="app-container">
  <!-- Mobile Header -->
  <div class="mobile-header">
    <button class="menu-btn" (click)="toggleMobileMenu()">☰</button>
    <div class="mobile-logo">{{ shopName }}</div>
    <button class="logout-mobile" (click)="logout()">🚪</button>
  </div>

  <!-- Sidebar -->
  <aside class="sidebar" [class.mobile-open]="isMobileMenuOpen">
    <div class="sidebar-header">
      <div class="logo">{{ shopName }}</div>
      <button class="close-menu" (click)="closeMobileMenu()">✕</button>
    </div>
    
    <nav class="sidebar-nav">
      <a 
        *ngFor="let item of menuItems" 
        [routerLink]="item.path"
        routerLinkActive="active"
        (click)="closeMenuOnLinkClick()"
      >
        <span class="nav-icon">{{ item.icon }}</span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    </nav>
    
    <div class="sidebar-footer">
      <button class="logout-btn" (click)="logout()">
        <span class="nav-icon">🚪</span>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>
    
    <footer class="footer">
      <p>&copy; {{ currentYear }} {{ shopName }} | All rights reserved</p>
    </footer>
  </main>
</div>

<!-- Overlay for mobile -->
<div class="mobile-overlay" *ngIf="isMobileMenuOpen" (click)="closeMobileMenu()"></div>
